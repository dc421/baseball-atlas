<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Living Atlas of Baseball</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=Libre+Franklin:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
<header class="top">
  <div class="mark" id="home" role="link" tabindex="0">Living Atlas <span>of</span> Baseball</div>
  <nav class="tabs" aria-label="Views">
    <button id="tab-y">Teams</button>
    <button id="tab-r">Rankings</button>
    <button id="tab-l">Places</button>
    <button id="tab-a">Add a pin</button>
  </nav>
  <button class="spinbtn" id="spin" title="Take me somewhere I haven't been">Spin</button>
  <div class="search"><input id="q" type="search" placeholder="Find a player, team, place, game…" autocomplete="off" aria-label="Search the atlas"><div class="results" id="results" hidden></div></div>
</header>
<main class="split">
  <div class="mapwrap">
    <svg id="map" role="img" aria-label="Map"></svg>
    <div class="maphint" id="maphint"></div>
    <div class="legend"><span><i style="background:var(--ghost)"></i>not yet explored</span><span><i style="background:var(--lit)"></i>lit up</span></div>
    <div class="mapbar" id="mapbar">
      <button class="iconbtn" id="play" aria-label="Play through the years" title="Play through the years">▶</button>
      <div class="bigyear" id="bigyear">1897</div>
      <input type="range" id="yr" min="1845" max="2025" value="1897" aria-label="Year">
      <div class="layers"><button class="chip" id="ly-pins" aria-pressed="true">Your pins</button></div>
    </div>
  </div>
  <aside class="panel" id="panel" aria-live="polite"><p class="note">Loading the atlas…</p></aside>
</main>
</div>
<script src="vendor/d3.min.js"></script>
<script src="vendor/topojson.min.js"></script>
<script src="app.js"></script>
</body>
</html>
