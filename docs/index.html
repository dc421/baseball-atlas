<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Move the Needle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=Libre+Franklin:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
<header class="top" id="top">
  <div class="mark" id="home" role="link" tabindex="0">Move <i>the</i> Needle</div>
  <nav class="tabs" aria-label="Homes">
    <button id="home-map"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2zM9 4v14M15 6v14"/></svg><span>Map</span></button>
    <button id="home-rankings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h2M4 12h2M4 18h2M9 6h11M9 12h8M9 18h5"/></svg><span>Rankings</span></button>
    <button id="home-tracker"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h3M4 12h3M4 18h3M10 6l2 2 4-4M10 12h10M10 18h10"/></svg><span>Tracker</span></button>
  </nav>
  <div class="search"><input id="q" type="search" placeholder="Find a player, team, league, game…" autocomplete="off" aria-label="Search the atlas"><div class="results" id="results" hidden></div></div>
  <div class="tools">
    <button class="tool" id="searchbtn" aria-label="Search"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14zM21 21l-5-5"/></svg></button>
    <button class="tool" id="syncbtn" hidden><i class="sdot" aria-hidden="true"></i><span></span></button>
    <button class="tool" id="spin" title="A random page"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h5v5M20 20h-5v-5M5 9a8 8 0 0 1 14-2M19 15a8 8 0 0 1-14 2"/></svg><span>Spin</span></button>
  </div>
</header>
<main class="split">
  <div class="mapwrap">
    <svg id="map" role="img" aria-label="Map"></svg>
    <button class="mapexpand" id="mapexpand" aria-label="Open the big map"><span>Open map ⤢</span></button>
    <button class="mapclose" id="mapclose">Close map ✕</button>
    <div class="maphint" id="maphint"></div>
    <div class="insets" id="insets"></div>
    <nav class="decstrip" id="decstrip" aria-label="Decades"></nav>
    <div class="legend"><span><i style="background:var(--ghost)"></i>draft</span><span><i style="background:var(--lit)"></i>locked</span></div>
    <div class="mapbar" id="mapbar">
      <button class="iconbtn" id="yprev" aria-label="Previous year">‹</button>
      <div class="bigyear" id="bigyear">2025</div>
      <button class="iconbtn" id="ynext" aria-label="Next year">›</button>
      <button class="iconbtn play" id="play" aria-label="Play through the years" title="Play through the years">▶</button>
      <input type="range" id="yr" min="1845" max="2025" value="2025" aria-label="Year">
    </div>
  </div>
  <aside class="panel" id="panel" aria-live="polite"><p class="note">Loading the atlas…</p></aside>
  <button class="mapfab" id="mapfab">Map</button>
</main>
</div>
<script src="vendor/d3.min.js"></script>
<script src="vendor/topojson.min.js"></script>
<script src="app.js"></script>
</body>
</html>
